name: Bug report
description: Something in okproof doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the proof file and the ledger output if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "okproof 0.0.1, Playwright 1.50, Node 22"
    validations:
      required: true
