name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node dist/src/cli.js check
      # Informational: Node's built-in coverage report, printed to the log. No threshold, so it can never block a merge.
      - name: Coverage report (informational)
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: node scripts/test.mjs --coverage
      - name: Pack smoke test
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run smoke
