name: Release

# The only way an official okproof version is published. Runs when a GitHub
# release is published from a v* tag on main. Publishes to npm with a
# provenance attestation and attests the tarball, so anyone can verify which
# commit and workflow built it (npm audit signatures / gh attestation verify).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag v$tag does not match package.json version $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: okproof-*.tgz
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Moves the major tag (v0) to the released commit so `uses: rudr19/okproof@v0`
  # follows the latest release. Runs only after a successful publish, and holds
  # the only contents: write permission in this workflow.
  move-major-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag is a v0.x.y release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v0[.][0-9]+[.][0-9]+$'; then
            echo "::error::Release tag $TAG does not match v0.X.Y; not moving v0"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true # needed for the push below, and only in this job
      - name: Released commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; not moving v0"
            exit 1
          fi
      - name: Move v0
        run: |
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin refs/tags/v0
