name: Release

# The only way an official okproof version is published. Runs when a GitHub
# release is published from a v* tag on main. Publishes to npm with a
# provenance attestation, attests the tarball and attaches the tarball and its
# attestation bundle to the release, so anyone can verify which
# commit and workflow built it (npm audit signatures / gh attestation verify).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag v$tag does not match package.json version $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        id: attest
        with:
          subject-path: okproof-*.tgz
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Hand the tarball and its attestation bundle to the release-assets job,
      # which is the only job here that may write to the release.
      - name: Collect release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir release-assets
          cp "okproof-$version.tgz" release-assets/
          cp "$BUNDLE_PATH" "release-assets/okproof-$version.intoto.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  # Attaches the packed tarball and its build-provenance attestation bundle to
  # the GitHub release, so the release carries a signed artifact (OpenSSF
  # Scorecard "Signed-Releases"). Runs only after a successful publish.
  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(release-assets/okproof-*.tgz release-assets/okproof-*.intoto.jsonl)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "::error::expected one tarball and one attestation bundle, found ${#files[@]} files"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

  # Moves the major tag (v0) to the released commit so `uses: rudr19/okproof@v0`
  # follows the latest release. Runs only after a successful publish, and holds
  # contents: write, as does release-assets (each job scopes its own).
  move-major-tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag is a v0.x.y release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v0[.][0-9]+[.][0-9]+$'; then
            echo "::error::Release tag $TAG does not match v0.X.Y; not moving v0"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true # needed for the push below, and only in this job
      - name: Released commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; not moving v0"
            exit 1
          fi
      - name: Move v0
        run: |
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin refs/tags/v0
