name: Action self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: okproof
        with:
          results: examples/action-fixture/junit.xml
          dir: examples/action-fixture/.okproof
          comment: 'false'
      - name: Assert the fixture is proven
        env:
          PROVEN: ${{ steps.okproof.outputs.proven }}
          SUMMARY: ${{ steps.okproof.outputs.summary }}
        run: |
          echo "$SUMMARY"
          [ "$PROVEN" = "true" ]
      - name: Proof file matches the fixture issue (offline sync --check)
        run: >-
          node dist/src/cli.js sync --issue 1 --check
          --body-file examples/action-fixture/issue-1.md
          examples/action-fixture/.okproof
