name: Action self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./
        id: okayd
        with:
          results: examples/action-fixture/junit.xml
          dir: examples/action-fixture/.okayd
          comment: 'false'
      - name: Assert the fixture is proven
        env:
          PROVEN: ${{ steps.okayd.outputs.proven }}
          SUMMARY: ${{ steps.okayd.outputs.summary }}
        run: |
          echo "$SUMMARY"
          [ "$PROVEN" = "true" ]
