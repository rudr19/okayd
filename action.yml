name: okproof
description: Prove a pull request meets its acceptance criteria, criterion by criterion.
author: rudr19
branding:
  icon: check-circle
  color: green

inputs:
  results:
    description: Path to a JUnit XML file from your test run. Optional if ledgers were already written by the okproof reporter.
    required: false
    default: ''
  dir:
    description: Folder holding the proof files and ledgers.
    required: false
    default: .okproof
  gate:
    description: Fail the step unless every criterion is proven. "true" or "false".
    required: false
    default: 'true'
  comment:
    description: Post the ledger as a pull request comment and job summary. "true" or "false".
    required: false
    default: 'true'
  issue:
    description: GitHub issue number whose checkboxes are the criteria. Optional; when empty, issues the PR body closes ("Closes #N", "Fixes #N", "Resolves #N") that already have a proof file are used.
    required: false
    default: ''
  sync:
    description: 'Keep proof files in step with the issue. "off" skips it; "check" fails if a proof file differs from its issue; "write" rewrites proof files in the workspace only (committing them is up to your workflow).'
    required: false
    default: check
  require-linked:
    description: 'Fail the gate when a linked issue ("Closes #N" in the PR body, or the issue input) has no proof file named for it. "true" or "false". Set false only if your PRs close issues okproof does not track.'
    required: false
    default: 'true'
  lint:
    description: 'Run okproof lint over your test files and count a test lint finds weak (no assertion, or only trivial ones) as asserting nothing, so its criterion is unproven. Needed because some runners (JUnit from node:test, for example) report no assertion counts. "auto" (default) scans every test file in the workspace; a path or glob (for example "tests/**/*.spec.ts") limits the scan; "off" disables it. Only used with the results input.'
    required: false
    default: auto
  differential:
    description: 'Differential proof (zero tokens). "on" runs your tests on the PR base and on HEAD and fails criteria whose tests also pass on the base, so they do not prove the change; "off" skips it. Needs test-command and results, and a checkout with fetch-depth: 0.'
    required: false
    default: 'off'
  test-command:
    description: 'The command that runs your tests and writes the results file (required when differential is on). It runs through the shell in a temporary checkout of the base and of HEAD, with OKPROOF_SIDE set to base or head.'
    required: false
    default: ''
  min-level:
    description: 'Evidence level (E0 to E4) a criterion must reach when its proof line names none, for example {E3}. E2 means a clean tagged test with a real assertion; E3 adds adversarial verification (okproof verify); E4 adds proof produced in this CI job on a commit whose proof folder matches the base branch. See "Evidence levels" in the README.'
    required: false
    default: E2
  base-ref:
    description: 'Branch the proof folder is compared with to allow E4. Default: the pull request base. Empty (not a pull request) means E4 is never granted.'
    required: false
    default: ${{ github.base_ref }}
  node-version:
    description: Node.js version used to run okproof.
    required: false
    default: '22'
  github-token:
    description: Token used to post the pull request comment. The job needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  proven:
    description: '"true" if every ledger is proven, otherwise "false".'
    value: ${{ steps.outputs.outputs.proven }}
  summary:
    description: One line per proof file, for example "okproof #142: 4/4 criteria met, proven".
    value: ${{ steps.outputs.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install okproof
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build

    - name: Find issues to sync
      id: issues
      shell: bash
      env:
        SYNC: ${{ inputs.sync }}
        ISSUE: ${{ inputs.issue }}
        DIR: ${{ inputs.dir }}
        REQUIRE_LINKED: ${{ inputs.require-linked }}
      run: |
        case "$SYNC" in
          off|check|write) node "$GITHUB_ACTION_PATH/scripts/action-linked-issues.mjs" ;;
          *) echo "sync must be off, check or write, got: $SYNC" >&2; exit 2 ;;
        esac

    - name: Sync proof files with issues
      shell: bash
      env:
        SYNC: ${{ inputs.sync }}
        ISSUES: ${{ steps.issues.outputs.issues }}
        DIR: ${{ inputs.dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        [ -n "$ISSUES" ] || exit 0
        flag=""
        [ "$SYNC" = "check" ] && flag="--check"
        IFS=',' read -ra list <<< "$ISSUES"
        status=0
        for n in "${list[@]}"; do
          node "$GITHUB_ACTION_PATH/dist/src/cli.js" sync --issue "$n" $flag "$DIR" || status=1
        done
        exit $status

    - name: Check proof files
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: node "$GITHUB_ACTION_PATH/dist/src/cli.js" check "$DIR"

    - name: Compare proof folder with the base branch
      id: base
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        DIR: ${{ inputs.dir }}
      run: |
        # E4 needs .okproof/ identical to the base branch, so a pull request cannot change what it is judged against.
        match=false
        if [ -n "$BASE_REF" ] && git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF" >/dev/null 2>&1; then
          if git diff --quiet FETCH_HEAD HEAD -- "$DIR" 2>/dev/null; then match=true; fi
        fi
        echo "matches=$match" >> "$GITHUB_OUTPUT"

    - name: Differential proof
      shell: bash
      env:
        DIFFERENTIAL: ${{ inputs.differential }}
        TEST_COMMAND: ${{ inputs.test-command }}
        RESULTS: ${{ inputs.results }}
        DIR: ${{ inputs.dir }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        case "$DIFFERENTIAL" in
          off|'') exit 0 ;;
          on) ;;
          *) echo "differential must be off or on, got: $DIFFERENTIAL" >&2; exit 2 ;;
        esac
        if [ -z "$TEST_COMMAND" ] || [ -z "$RESULTS" ]; then
          echo "differential: on needs the test-command and results inputs." >&2
          exit 2
        fi
        base=()
        [ -n "$BASE_REF" ] && base=(--base "origin/$BASE_REF")
        # Exit 1 means some criterion is not proven by the change; the Gate step reports it. Only a failure to run stops here.
        rc=0
        node "$GITHUB_ACTION_PATH/dist/src/cli.js" diff "${base[@]}" --test "$TEST_COMMAND" --results "$RESULTS" "$DIR" || rc=$?
        [ "$rc" -le 1 ] || exit "$rc"

    - name: Build ledgers from JUnit XML
      shell: bash
      env:
        MIN_LEVEL: ${{ inputs.min-level }}
        BASE_MATCH: ${{ steps.base.outputs.matches }}
        RESULTS: ${{ inputs.results }}
        DIR: ${{ inputs.dir }}
        LINT: ${{ inputs.lint }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OKPROOF_NO_COMMENT: ${{ inputs.comment == 'true' && '0' || '1' }}
      run: |
        lint=()
        case "$LINT" in
          off) ;;
          ''|auto) lint=(--lint=) ;;
          *) lint=("--lint=$LINT") ;;
        esac
        level=(--min-level "${MIN_LEVEL:-E2}")
        [ "$BASE_MATCH" = "true" ] && level+=(--proof-matches-base)
        if [ -n "$RESULTS" ]; then
          node "$GITHUB_ACTION_PATH/dist/src/cli.js" ingest "$RESULTS" "$DIR" "${lint[@]}" "${level[@]}"
        else
          echo "No results input; using ledgers already in $DIR."
        fi

    - name: Set outputs
      id: outputs
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        RESULTS: ${{ inputs.results }}
        MIN_LEVEL: ${{ inputs.min-level }}
      run: node "$GITHUB_ACTION_PATH/scripts/action-outputs.mjs"

    - name: Gate
      shell: bash
      env:
        GATE: ${{ inputs.gate }}
        DIR: ${{ inputs.dir }}
        RESULTS: ${{ inputs.results }}
        REQUIRED: ${{ steps.issues.outputs.required }}
        LINT: ${{ inputs.lint }}
        MIN_LEVEL: ${{ inputs.min-level }}
        BASE_MATCH: ${{ steps.base.outputs.matches }}
      run: |
        lint=()
        case "$LINT" in
          off) ;;
          ''|auto) lint=(--lint=) ;;
          *) lint=("--lint=$LINT") ;;
        esac
        # Gate from the results ingested in THIS job, never from a committed ledger.
        # Every issue the PR links must have its own proof file.
        if [ "$GATE" = "true" ]; then
          extra=(--min-level "${MIN_LEVEL:-E2}")
          [ -n "$REQUIRED" ] && extra+=(--require-issues "$REQUIRED")
          if [ -n "$RESULTS" ]; then
            [ "$BASE_MATCH" = "true" ] && extra+=(--proof-matches-base)
            node "$GITHUB_ACTION_PATH/dist/src/cli.js" gate --results "$RESULTS" "${extra[@]}" "${lint[@]}" "$DIR"
          else
            echo "::warning::okproof: No results input was given, so the ledger is not bound to a test run in this job. The gate is trusting committed ledger files, which anyone who can commit can forge. Set the results input to your JUnit or CTRF file."
            node "$GITHUB_ACTION_PATH/dist/src/cli.js" gate "${extra[@]}" "$DIR"
          fi
        fi
